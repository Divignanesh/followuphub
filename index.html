<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Safari does not use SVG favicons, so the ICO and PNGs come first as
         the fallback; browsers that support SVG still prefer it. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <noscript>
      <style>
        /* Framer Motion writes its pre-animation state inline during SSR.
           Without JS there is nothing to animate it back, so reveal it and
           reset anything left mid-transform, including the scroll-linked
           zoom on the dashboard. */
        [style*="opacity:0"],
        [style*="scale("],
        [style*="translateY"] { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
